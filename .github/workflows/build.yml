name: Validate Flutter

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master, fix/ludo-rules-tests-20261110]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze Dart and Flutter code
        run: flutter analyze

      - name: Run automated tests
        run: flutter test
