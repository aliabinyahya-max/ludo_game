name: Validate Flutter and Android Toolchain

on:
  push:
    branches: [main, master, feat/3d-board-animations-phase-03-04-20261110]
  pull_request:
    branches: [main, master, fix/ludo-rules-tests-20261110, feat/premium-menu-phase-01-02-20261110]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      # GitHub-hosted Ubuntu runners already include Android command-line tools.
      # Avoid android-actions/setup-android@v3 here: its legacy "tools" package
      # request fails because that obsolete SDK package is no longer published.
      - name: Locate preinstalled Android SDK manager
        id: android_sdk
        shell: bash
        run: |
          set -euo pipefail
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            echo "::error::Android sdkmanager is not available on this runner"
            exit 1
          fi
          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"
          "$SDKMANAGER" --version

      # Provision and verify the exact native toolchain required by android/app/build.gradle.
      # This is SDK preparation only: no Gradle task, APK, AAB, or app build is run.
      - name: Install and verify Android SDK components
        shell: bash
        env:
          SDKMANAGER: ${{ steps.android_sdk.outputs.sdkmanager }}
        run: |
          set -euo pipefail
          # sdkmanager may exit as soon as all licenses are accepted.
          # Avoid treating yes(1) SIGPIPE as a failed SDK license operation.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          sdkmanager_status="${PIPESTATUS[1]}"
          set -o pipefail
          if [ "$sdkmanager_status" -ne 0 ]; then
            echo "::error::sdkmanager --licenses failed with exit code $sdkmanager_status"
            exit "$sdkmanager_status"
          fi
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.31.4"

          installed="$("$SDKMANAGER" --list_installed)"
          for package in \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.31.4"; do
            if ! grep -Fq "$package" <<< "$installed"; then
              echo "::error::Required Android SDK package is missing: $package"
              exit 1
            fi
          done

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze Dart and Flutter code
        run: flutter analyze

      - name: Run automated tests
        run: flutter test
