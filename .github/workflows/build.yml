name: Validate Flutter

on:
  push:
    branches: [main, master, feat/3d-board-animations-phase-03-04-20261110]
  pull_request:
    branches: [main, master, fix/ludo-rules-tests-20261110, feat/premium-menu-phase-01-02-20261110]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze Dart and Flutter code
        run: flutter analyze

      - name: Run automated tests
        run: flutter test


  # This job is deliberately gated to the single explicitly marked push.
  # It produces one debug APK for physical-device acceptance, not a release.
  build_android_device_test:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[one-time-build]')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build the one-time Android device-test APK
        run: flutter build apk --debug

      - name: Upload device-test APK
        uses: actions/upload-artifact@v4
        with:
          name: ludo-android-device-test
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
